name: Free Proxy
slug: free_proxy
version: "0.1.3"
description: OpenAI-compatible proxy for zero-price OpenCode and OpenRouter models
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8080
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: OpenAI-compatible API
options:
  openrouter_api_key: ""
  proxy_api_key: ""
  default_model: default
  enable_thinking: false
  listen_addr: 0.0.0.0:8080
schema:
  openrouter_api_key: password?
  proxy_api_key: password?
  default_model: str
  enable_thinking: bool
  listen_addr: str
